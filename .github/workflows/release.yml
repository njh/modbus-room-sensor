name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel in-progress runs so two releases don't race each other
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt update
          apt install -y make zip

      - name: Build
        run: make all

      - name: Show reports
        if: always()
        run: cat reports/*.txt

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Publish release
        run: |
          TAG="$(date -u +%Y-%m-%d)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi
          gh release create "$TAG" release/* \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --notes "Built from ${GITHUB_SHA}"
